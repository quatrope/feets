
# =============================================================================
# FLAKE 8 & Coverage
# =============================================================================

[flake8]
max-line-length = 80
extend-select = B950
extend-ignore = E203,E501,E701,B027
exclude = __pycache__
per-file-ignores = feets/io.py:A005

[report]
omit =
    feets/libs/*

# =============================================================================
# TOX
# =============================================================================

[tox]
envlist =
    style,
    docstyle,
    check-manifest,
    check-headers,
    check-testdir,
    mkdocs,
    py310,
    py311,
    py312,
    py313,
    coverage


[testenv:style]
skip_install = True
usedevelop = False
labels = static
deps =
    flake8
    flake8-bugbear
    flake8-import-order
    flake8-black
    flake8-builtins
commands =
    flake8 setup.py feets tests {posargs}


[testenv:docstyle]
labels = static
skip_install = True
usedevelop = True
deps =
    pydocstyle
    tomli
commands =
    pydocstyle feets/ --ignore-decorators=doc_inherit --convention=numpy --add-ignore=D401 {posargs}


[testenv:check-manifest]
labels = static
basepython = python3
skip_install = True
deps = check-manifest
commands = check-manifest {posargs}


[testenv:check-headers]
labels = static
skip_install = True
deps =
    https://github.com/quatrope/qafan/archive/refs/heads/master.zip
commands =
    check-headers check feets/ tests/ setup.py --header-template .header-template {posargs}


[testenv:check-testdir]
labels = static
skip_install = True
deps =
    https://github.com/quatrope/qafan/archive/refs/heads/master.zip
commands =
    check-testdir check tests/ --reference-dir feets/ {posargs}


[testenv]
labels = dynamic
usedevelop = True
deps =
    ipdb
    pytest
    pytest-cov
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    pytest tests/ --cov-report= --cov=feets --cov-append -vm '' {posargs}


[testenv:coverage]
labels = dynamic
usedevelop = True
deps =
    {[testenv]deps}
    coverage
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
allowlist_externals = tox
commands =
    tox -e py310,py311,py312,py313
    coverage erase
    coverage combine
    coverage report -m --fail-under 91


[testenv:mkdocs]
labels = docs
description = "Invoke sphinx-build to build the HTML docs"
usedevelop = True
skip_install = False
changedir = docs
deps =
    -r {toxinidir}/docs/requirements.txt
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees source {envtmpdir}/html